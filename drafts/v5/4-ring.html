<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"><title>4 Кольцо</title><style>
.stage{height:100svh;overflow:hidden;perspective:1600px;display:grid;place-items:center}
.scene{position:relative;width:1px;height:1px;transform-style:preserve-3d;transform:rotateX(-12deg)}
.ring{position:absolute;transform-style:preserve-3d;animation:spin 48s linear infinite}
.card{position:absolute;width:var(--cw);left:calc(var(--cw)/-2);top:calc(var(--ch)/-2);transform:rotateY(var(--a)) translateZ(var(--rad));backface-visibility:hidden}
.card img,.card video{width:100%;height:var(--ch);object-fit:cover;display:block}
@keyframes spin{to{transform:rotateY(-360deg)}}
.wm{position:absolute;transform:translate(-50%,-50%) translateZ(1px);font-weight:900;font-stretch:125%;letter-spacing:-.045em}
.sub{position:absolute;bottom:6vh;left:0;right:0;text-align:center;color:var(--quiet)}
:root{--cw:10.5vw;--ch:13.5vw;--rad:40vw}
@media(max-width:760px){.wm{top:-40vw}:root{--cw:24vw;--ch:31vw;--rad:52vw}}
</style></head><body>
<section class="stage"><div class="scene"><div class="ring" id="ring"></div><h1 class="wm" id="wm">MANEVRIT</h1></div><p class="sub">AI-видео и фото для брендов</p></section>
<script src="works.js"></script><script>
function fit(el,frac){el.style.fontSize="100px";el.style.fontSize=(100*innerWidth*frac/el.getBoundingClientRect().width)+"px"}
const ring=document.getElementById('ring'),n=12;let h='';
for(let i=0;i<n;i++)h+=`<div class="card" style="--a:${i*360/n}deg">${media(WORKS[i%WORKS.length])}</div>`;ring.innerHTML=h;
const wm=document.getElementById('wm');document.fonts.load('900 100px Archivo').then(()=>document.fonts.ready).then(()=>fit(wm,innerWidth<760?.86:.56));
</script></body></html>
