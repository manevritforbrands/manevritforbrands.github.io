<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"><title>2 Контактный лист</title><style>
.sheet{position:absolute;inset:70px 3vw 3vw;display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:1fr;gap:6px}
.cell{position:relative;overflow:hidden;background:#eee;opacity:0;animation:pop .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d)}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.cell:hover img,.cell:hover video{transform:scale(1.08)}
@keyframes pop{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0)}}
.name{grid-column:2/9;grid-row:2/4;display:grid;place-items:center;background:var(--paper);opacity:1;animation:none}
.name .wm{font-weight:900;font-stretch:125%;letter-spacing:-.045em}
.name p{margin:.4em 0 0;color:var(--quiet)}
@media(max-width:760px){.sheet{inset:52px 10px 10px;grid-template-columns:repeat(4,1fr);gap:4px}.name{grid-column:1/5;grid-row:3/5}}
</style></head><body>
<div class="sheet" id="sheet"></div>
<script src="works.js"></script><script>
const sh=document.getElementById('sheet'),mob=innerWidth<760,cols=mob?4:9,rows=mob?8:4;let h='',k=0;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
 if(!mob&&r>=1&&r<=2&&c>=1&&c<=7)continue; if(mob&&r>=2&&r<=3)continue;
 const w=WORKS[(k*3+r)%WORKS.length];h+=`<div class="cell" style="--d:${(Math.random()*.9).toFixed(2)}s">${media(w)}</div>`;k++}
sh.innerHTML=h+'<div class="cell name"><div style="text-align:center"><h1 class="wm" id="wm">MANEVRIT</h1><p>AI-видео и фото для брендов</p></div></div>';
const wm=document.getElementById('wm');document.fonts.load('900 100px Archivo').then(()=>document.fonts.ready).then(()=>{wm.style.fontSize='100px';const box=wm.parentElement.parentElement.getBoundingClientRect();wm.style.fontSize=(100*box.width*.86/wm.getBoundingClientRect().width)+'px'});
</script></body></html>
