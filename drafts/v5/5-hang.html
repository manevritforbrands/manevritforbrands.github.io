<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"><title>5 Экспозиция</title><style>
.scroller{height:420vh}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.row{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:flex-end;gap:5vw;padding:0 6vw 17vh 3vw;will-change:transform}
.wm{flex:none;font-weight:900;font-stretch:62%;letter-spacing:-.02em;line-height:.8;align-self:flex-end;margin-bottom:-.06em}
.intro{flex:none;width:15em;align-self:flex-end;color:var(--quiet);margin-left:-2vw}
.intro b{display:block;color:var(--ink);font-weight:500}
figure{margin:0;flex:none}
figure img,figure video{display:block;height:var(--h);width:auto;aspect-ratio:var(--r);object-fit:cover}
figcaption{margin-top:12px;font-size:13px;color:var(--quiet)}
.bar{position:absolute;left:3vw;right:3vw;bottom:7vh;height:1px;background:#e3e3e3}.bar i{display:block;height:100%;background:var(--ink);width:0}
@media(max-width:760px){.row{padding-bottom:20vh}}
</style></head><body>
<section class="scroller" id="sc"><div class="pin"><div class="row" id="row"><h1 class="wm" id="wm">MANE<br>VRIT</h1><p class="intro"><b>for Brands</b>AI-видео и фото для брендов. Листайте вниз, работы идут вправо.</p></div><div class="bar"><i id="bar"></i></div></div></section>
<script src="works.js"></script><script>
const row=document.getElementById('row'),sc=document.getElementById('sc'),bar=document.getElementById('bar'),wm=document.getElementById('wm');
const hs=['58vh','44vh','36vh','62vh','50vh','40vh','56vh'];
row.insertAdjacentHTML('beforeend',WORKS.map((w,i)=>`<figure style="--h:${hs[i]};--r:${w.r}">${media(w)}<figcaption>Творческая работа</figcaption></figure>`).join(''));
wm.style.fontSize=Math.min(innerHeight*.43,innerWidth*.36)+'px';
(function tick(){const p=Math.min(1,Math.max(0,scrollY/(sc.offsetHeight-innerHeight)));const max=row.scrollWidth-innerWidth;
 row.style.transform=`translateX(${-p*max}px)`;bar.style.width=(p*100)+'%';requestAnimationFrame(tick)})();
</script></body></html>
