<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"><title>1 Проявка</title><style>
.frame{position:absolute;left:0;right:0;top:76px;height:calc(100svh - 76px - 27vw);display:grid;place-items:center}
.frame .pic{position:absolute;height:100%;aspect-ratio:var(--r);max-width:92vw;object-fit:cover;opacity:0}
.frame .pic.dev{animation:develop 2.6s cubic-bezier(.16,1,.3,1) forwards}
.frame .pic.out{opacity:1;animation:none;filter:none;transition:opacity .9s;opacity:0}
@keyframes develop{0%{opacity:1;filter:invert(1) brightness(1.7) contrast(.55) saturate(0)}35%{filter:invert(.55) brightness(1.4) contrast(.6) saturate(.2)}100%{opacity:1;filter:none}}
.wm{position:absolute;left:50%;translate:-50% 0;bottom:1.2vw;font-weight:850;font-stretch:62%;letter-spacing:-.02em}
.meta{position:absolute;left:3vw;right:3vw;bottom:calc(27vw + 10px);display:flex;justify-content:space-between;color:var(--quiet);font-size:13px;pointer-events:none}
@media(max-width:760px){.frame{top:56px;height:calc(100svh - 56px - 30vw)}.meta{bottom:calc(30vw + 8px)}}
</style></head><body>
<div class="frame" id="frame"></div>
<div class="meta"><span>Творческая работа</span><span id="n"></span></div>
<h1 class="wm" id="wm">MANEVRIT</h1>
<script src="works.js"></script><script>
function fit(el,frac){el.style.fontSize="100px";el.style.fontSize=(100*innerWidth*frac/el.getBoundingClientRect().width)+"px"}
const fr=document.getElementById('frame'),n=document.getElementById('n'),wm=document.getElementById('wm');
fr.innerHTML=WORKS.map(w=>media(w,'pic').replace('class="pic"',`class="pic" style="--r:${w.r}"`)).join('');
const pics=[...fr.children];let i=0;
function show(){pics.forEach(p=>p.classList.remove('dev','out'));pics[(i-1+pics.length)%pics.length].classList.add('out');
 void pics[i].offsetWidth;pics[i].classList.add('dev');n.textContent=String(i+1).padStart(2,'0')+' / '+String(pics.length).padStart(2,'0');i=(i+1)%pics.length}
document.fonts.load('900 100px Archivo').then(()=>document.fonts.ready).then(()=>fit(wm,.96));addEventListener('resize',()=>fit(wm,.96));show();setInterval(show,4200);
</script></body></html>
