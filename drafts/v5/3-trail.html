<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"><title>3 Шлейф</title><style>
.stage{position:relative;height:100svh;overflow:hidden;cursor:crosshair}
.trail{position:absolute;width:13vw;min-width:120px;translate:-50% -50%;pointer-events:none;animation:life 1.9s cubic-bezier(.16,1,.3,1) forwards}
.trail img,.trail video{width:100%;display:block;aspect-ratio:var(--r);object-fit:cover}
@keyframes life{0%{scale:.6;opacity:0}12%{scale:1;opacity:1}70%{opacity:1}100%{scale:.92;opacity:0}}
.mark{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;z-index:100000}
.wm{font-weight:900;font-stretch:125%;letter-spacing:-.045em}
.mark p{margin:1.1em 0 0;color:var(--quiet)}
</style></head><body>
<section class="stage" id="st"><div class="mark"><h1 class="wm" id="wm">MANEVRIT</h1><p>Ведите курсором: здесь работы студии</p></div></section>
<script src="works.js"></script><script>
function fit(el,frac){el.style.fontSize="100px";el.style.fontSize=(100*innerWidth*frac/el.getBoundingClientRect().width)+"px"}
const st=document.getElementById('st'),wm=document.getElementById('wm');let lx=-999,ly=-999,k=0,user=-1e9;
function drop(x,y){const w=WORKS[k++%WORKS.length],d=document.createElement('div');d.className='trail';d.style.cssText=`left:${x}px;top:${y}px;--r:${w.r};z-index:${k}`;
 d.innerHTML=media(w);st.appendChild(d);setTimeout(()=>d.remove(),1900)}
function move(x,y){if(Math.hypot(x-lx,y-ly)>innerWidth*.07){drop(x,y);lx=x;ly=y}}
st.addEventListener('pointermove',e=>{user=performance.now();move(e.clientX,e.clientY)});
let t=0;(function auto(){if(performance.now()-user>2500){t+=.012;move(innerWidth*(.5+.36*Math.sin(t*1.3)),innerHeight*(.5+.3*Math.sin(t*2.1)))}requestAnimationFrame(auto)})();
document.fonts.load('900 100px Archivo').then(()=>document.fonts.ready).then(()=>fit(wm,innerWidth<760?.9:.62));
</script></body></html>
