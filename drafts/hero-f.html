<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F — Чёрный: живой свет от работ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300&family=Cormorant+Garamond:ital,wght@1,300&family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#f1ede6}
body{font:500 11px/1.5 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase}
a{color:inherit;text-decoration:none}
nav{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:center;gap:40px;padding:24px 16px;opacity:.85}
.stage{position:relative;height:100svh;min-height:620px;overflow:hidden;isolation:isolate}
/* Эмбилайт: размытая копия ролика даёт живой цветной свет за всей сценой */
.amb{position:absolute;inset:-15%;z-index:-1;filter:blur(90px) saturate(1.4);opacity:.55;transition:opacity 1s}
.amb video,.amb img{width:100%;height:100%;object-fit:cover}
.stage:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),#000 75%)}
.t{position:absolute;left:var(--x);top:var(--y);width:var(--w);margin:0;opacity:0;animation:in 1.6s cubic-bezier(.2,.7,.1,1) forwards;animation-delay:var(--d)}
.t img,.t video{position:relative;display:block;width:100%;aspect-ratio:var(--r);object-fit:cover}
.t:before{content:"";position:absolute;inset:8%;background:var(--img) center/cover;filter:blur(34px) saturate(1.5);opacity:.75;translate:0 12%}
@keyframes in{from{opacity:0;scale:.94}to{opacity:1;scale:1}}
.mark{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:5;pointer-events:none}
.mark h1{margin:0;font:italic 300 clamp(70px,11.5vw,200px)/.85 'Cormorant Garamond',serif;letter-spacing:-.02em;text-transform:none}
.mark p{margin:22px 0 0;font:300 clamp(11px,1vw,14px)/1 Unbounded,sans-serif;letter-spacing:.9em;padding-left:.9em}
@media(max-width:760px){nav{gap:18px;font-size:10px}.t{left:var(--mx);top:var(--my);width:var(--mw)}.t.nm{display:none}.mark p{letter-spacing:.5em}}
</style>
</head>
<body>
<nav><a href="#">Главная</a><a href="#">Портфолио</a><a href="#">Стоимость</a><a href="#">Контакты</a></nav>
<section class="stage">
  <div class="amb"><video poster="../assets/videos/racing-case.jpg" src="../assets/videos/racing-case.mp4" autoplay muted loop playsinline></video></div>
  <figure class="t" style="--img:url(../assets/garden-editorial.jpg);--x:8%;--y:11%;--w:13vw;--r:4/5;--d:.1s;--mx:4%;--my:9%;--mw:36vw"><img src="../assets/garden-editorial.jpg" alt=""></figure>
  <figure class="t" style="--img:url(../assets/teal-fashion.jpg);--x:33%;--y:8%;--w:8vw;--r:4/5;--d:.35s;--mx:48%;--my:6%;--mw:24vw"><img src="../assets/teal-fashion.jpg" alt=""></figure>
  <figure class="t" style="--img:url(../assets/videos/racing-case.jpg);--x:72%;--y:7%;--w:13vw;--r:3/4;--d:.2s;--mx:70%;--my:13%;--mw:32vw"><video poster="../assets/videos/racing-case.jpg" src="../assets/videos/racing-case.mp4" autoplay muted loop playsinline></video></figure>
  <figure class="t" style="--img:url(../assets/jewellery-detail.jpg);--x:3%;--y:56%;--w:11vw;--r:2/3;--d:.5s;--mx:2%;--my:66%;--mw:28vw"><img src="../assets/jewellery-detail.jpg" alt=""></figure>
  <figure class="t" style="--img:url(../assets/lake-tailoring.jpg);--x:27%;--y:68%;--w:11vw;--r:4/5;--d:.65s;--mx:34%;--my:73%;--mw:28vw"><img src="../assets/lake-tailoring.jpg" alt=""></figure>
  <figure class="t" style="--img:url(../assets/videos/mono-case.jpg);--x:61%;--y:66%;--w:13vw;--r:1/1;--d:.45s;--mx:68%;--my:68%;--mw:34vw"><video poster="../assets/videos/mono-case.jpg" src="../assets/videos/mono-case.mp4" autoplay muted loop playsinline></video></figure>
  <figure class="t nm" style="--img:url(../assets/tennis-lifestyle.jpg);--x:86%;--y:44%;--w:10.5vw;--r:4/5;--d:.8s"><img src="../assets/tennis-lifestyle.jpg" alt=""></figure>
  <div class="mark"><h1>ManeVRit</h1><p>for brands</p></div>
</section>
</body></html>
