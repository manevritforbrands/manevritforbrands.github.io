<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E — Белый: ролик внутри букв</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;900&family=Cormorant+Garamond:ital,wght@1,400&family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#0b0b0b}
body{font:500 11px/1.5 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase}
a{color:inherit;text-decoration:none}
nav{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:24px 3vw}
nav div{display:flex;gap:36px}
.stage{position:relative;height:100svh;min-height:620px;overflow:hidden}
.t{position:absolute;left:var(--x);top:var(--y);width:var(--w);margin:0;opacity:0;animation:in 1.4s cubic-bezier(.2,.7,.1,1) forwards;animation-delay:var(--d)}
.t img{display:block;width:100%;aspect-ratio:var(--r);object-fit:cover}
@keyframes in{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
/* Название — окно: сквозь буквы идёт ролик */
.word{position:absolute;left:0;right:0;top:50%;translate:0 -50%;height:min(18vw,290px);overflow:hidden;z-index:4}
.word video,.word img{position:absolute;inset:3px 0;height:calc(100% - 6px)!important;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.word b{position:absolute;inset:-2px;display:grid;place-items:center;background:#fff;color:#000;mix-blend-mode:screen;
  font:900 min(13.6vw,240px)/1 Unbounded,sans-serif;letter-spacing:-.045em}
.sub{position:absolute;z-index:5;left:0;right:0;top:calc(50% + min(11vw,170px));display:flex;justify-content:center;align-items:baseline;gap:18px}
.sub i{font:italic 400 clamp(26px,2.6vw,42px)/1 'Cormorant Garamond',serif;text-transform:none;letter-spacing:0}
@media(max-width:760px){nav div{gap:16px;font-size:10px}nav>a{display:none}nav{justify-content:center}.t{left:var(--mx);top:var(--my);width:var(--mw)}.t.nm{display:none}.sub{flex-direction:column;align-items:center;gap:8px}}
</style>
</head>
<body>
<nav><a href="#">ManeVRit</a><div><a href="#">Портфолио</a><a href="#">Стоимость</a><a href="#">Контакты</a></div><a href="#">Telegram ↗</a></nav>
<section class="stage">
  <figure class="t" style="--x:6%;--y:9%;--w:12vw;--r:4/5;--d:.1s;--mx:4%;--my:9%;--mw:34vw"><img src="../assets/garden-editorial.jpg" alt=""></figure>
  <figure class="t" style="--x:40%;--y:7%;--w:8vw;--r:4/5;--d:.3s;--mx:58%;--my:7%;--mw:26vw"><img src="../assets/teal-fashion.jpg" alt=""></figure>
  <figure class="t" style="--x:79%;--y:10%;--w:11vw;--r:2/3;--d:.2s;--mx:66%;--my:74%;--mw:30vw"><img src="../assets/jewellery-detail.jpg" alt=""></figure>
  <figure class="t" style="--x:13%;--y:70%;--w:10vw;--r:4/5;--d:.5s;--mx:6%;--my:72%;--mw:30vw"><img src="../assets/lake-tailoring.jpg" alt=""></figure>
  <figure class="t nm" style="--x:70%;--y:72%;--w:9vw;--r:4/5;--d:.6s"><img src="../assets/tennis-lifestyle.jpg" alt=""></figure>
  <div class="word"><video poster="../assets/videos/racing-case.jpg" src="../assets/videos/racing-case.mp4" autoplay muted loop playsinline></video><b>MANEVRIT</b></div>
  <div class="sub"><i>for Brands</i><span>AI-видео и фото</span></div>
</section>
</body></html>
