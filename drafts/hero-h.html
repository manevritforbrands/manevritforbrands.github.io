<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManeVRit for Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#fff;--quiet:#6d6d6d}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:400 15px/1.5 'Golos Text',system-ui,sans-serif}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit;text-decoration:none}
nav{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 3vw;mix-blend-mode:difference;color:#fff}
nav .links{display:flex;gap:32px}
nav a{position:relative;white-space:nowrap}nav a.on:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor}
.logo{font:800 17px/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:-.02em}

/* Сцена: название — окно в ролик. Скролл «влетает» в букву, и ролик раскрывается на весь экран */
.scroller{height:260vh;position:relative}
.pin{position:sticky;top:0;height:100svh;overflow:hidden}
.reel{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mask{position:absolute;inset:0;background:var(--paper);mix-blend-mode:screen;display:grid;place-items:center;will-change:transform}
.mask b{font:900 100px/1 Archivo,sans-serif;font-stretch:62%;letter-spacing:-.035em;color:#000;white-space:nowrap;
  transition:font-stretch 1.8s cubic-bezier(.16,1,.3,1),letter-spacing 1.8s cubic-bezier(.16,1,.3,1)}
.ready .mask b{font-stretch:125%;letter-spacing:-.045em}
.t{position:absolute;left:var(--x);top:var(--y);width:var(--w);margin:0;z-index:3;opacity:0;
  transition:opacity 1.4s cubic-bezier(.16,1,.3,1) var(--d),translate 1.4s cubic-bezier(.16,1,.3,1) var(--d);translate:0 24px}
.ready .t{opacity:1;translate:0 0}
.t img{display:block;width:100%;aspect-ratio:var(--r);object-fit:cover}
.under{position:absolute;z-index:4;left:0;right:0;display:flex;justify-content:center;gap:28px;color:var(--quiet);font-size:15px}
.under em{font:600 20px/1 Archivo,sans-serif;font-style:normal;color:var(--ink);letter-spacing:-.01em}
.under{align-items:baseline}
@media(max-width:760px){
  nav{justify-content:center;padding:18px 12px}nav .links{gap:14px;font-size:12.5px}nav .tg,nav .logo{display:none}.under{flex-direction:column;align-items:center;gap:6px}
  .t{left:var(--mx);top:var(--my);width:var(--mw)}.t.nm{display:none}
}
@media(prefers-reduced-motion:reduce){.mask b,.t{transition:none}}
</style>
</head>
<body>
<nav><a class="logo" href="#">MANEVRIT</a>
  <div class="links"><a class="on" href="#">Главная</a><a href="#">AI-видео</a><a href="#">AI-фото</a><a href="#">Стоимость</a><a href="#">Контакты</a></div>
  <a class="tg" href="https://t.me/manevritforbrands">Telegram</a></nav>
<section class="scroller" id="scroller">
  <div class="pin">
    <video class="reel" poster="../assets/videos/racing-case.jpg" src="../assets/videos/racing-case.mp4" autoplay muted loop playsinline></video>
    <div class="mask" id="mask"><b id="word">MANEVR<span id="hole">I</span>T</b></div>
    <figure class="t" style="--x:5%;--y:9%;--w:12vw;--r:4/5;--d:.35s;--mx:4%;--my:10%;--mw:36vw"><img src="../assets/garden-editorial.jpg" alt=""></figure>
    <figure class="t" style="--x:38%;--y:8%;--w:7.5vw;--r:4/5;--d:.5s;--mx:62%;--my:8%;--mw:28vw"><img src="../assets/teal-fashion.jpg" alt=""></figure>
    <figure class="t" style="--x:80%;--y:11%;--w:10.5vw;--r:2/3;--d:.45s;--mx:64%;--my:70%;--mw:31vw"><img src="../assets/jewellery-detail.jpg" alt=""></figure>
    <figure class="t" style="--x:14%;--y:69%;--w:9.5vw;--r:4/5;--d:.6s;--mx:5%;--my:71%;--mw:31vw"><img src="../assets/lake-tailoring.jpg" alt=""></figure>
    <figure class="t nm" style="--x:69%;--y:71%;--w:8.5vw;--r:4/5;--d:.7s"><img src="../assets/tennis-lifestyle.jpg" alt=""></figure>
    <p class="under" id="under"><em>for Brands</em><span>AI-видео и фото для брендов</span></p>
  </div>
</section>
<section style="height:100vh;display:grid;place-items:center;color:var(--quiet)">дальше — обо мне и последние проекты</section>
<script>
const word=document.getElementById('word'),mask=document.getElementById('mask'),hole=document.getElementById('hole'),
      under=document.getElementById('under'),tiles=[...document.querySelectorAll('.t')],scroller=document.getElementById('scroller');
// Подгоняем название под 92% ширины экрана в финальной (широкой) ширине букв
function fit(){word.style.transition='none';document.body.classList.add('ready');word.style.fontSize='100px';
  const w=word.getBoundingClientRect().width;word.style.fontSize=(100*innerWidth*.92/w)+'px';
  const r=word.getBoundingClientRect();under.style.top=(r.bottom+18)+'px';
  if(!document.body.dataset.started){document.body.classList.remove('ready');void word.offsetWidth}word.style.transition=''}
let ox=innerWidth/2,oy=innerHeight/2;
function measure(){const h=hole.getBoundingClientRect();ox=h.left+h.width/2;oy=h.top+h.height/2}
document.fonts.ready.then(()=>{fit();requestAnimationFrame(()=>{document.body.classList.add('ready');document.body.dataset.started=1;setTimeout(measure,1900)})});
addEventListener('resize',()=>{fit();measure()});
// Скролл: маска растёт от центра буквы I, пока штрих буквы не закроет экран целиком
function tick(){const p=Math.min(1,Math.max(0,scrollY/(scroller.offsetHeight-innerHeight)));
  const e=Math.pow(p,2.2),s=1+e*90,k=Math.min(1,p*1.6);mask.style.transformOrigin=`${ox}px ${oy}px`;
  mask.style.transform=`translate(${(innerWidth/2-ox)*k}px,${(innerHeight/2-oy)*k}px) scale(${s})`;
  const f=Math.max(0,1-p*3);mask.style.opacity=p>.7?Math.max(0,1-(p-.7)*4):1;const v=p>0?f:'';tiles.forEach(t=>t.style.opacity=v);under.style.opacity=v;
  requestAnimationFrame(tick)}tick();
</script>
</body></html>
