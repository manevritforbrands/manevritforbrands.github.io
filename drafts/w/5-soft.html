<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;500;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#E7E7EB;color:#16161a;font:300 16px/1.5 Geologica,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.orbs{position:fixed;inset:0;pointer-events:none;filter:blur(80px);opacity:.75}
.orbs i{position:absolute;border-radius:50%;animation:drift 22s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-10vw;background:#F6C9B8}
.orbs i:nth-child(2){width:40vw;height:40vw;right:-6vw;top:20vh;background:#C9C3F4;animation-duration:28s}
.orbs i:nth-child(3){width:34vw;height:34vw;left:30vw;bottom:-18vw;background:#BFE3DA;animation-duration:25s}
@keyframes drift{to{transform:translate(6vw,4vw) scale(1.1)}}
nav{position:fixed;z-index:9;top:20px;left:50%;translate:-50% 0;display:flex;gap:2px;padding:6px;border-radius:99px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px -12px rgba(30,30,60,.25)}
nav a{padding:9px 16px;border-radius:99px;font-weight:500;font-size:14px;white-space:nowrap}nav a.on{background:#16161a;color:#fff}
.s{position:relative;min-height:100svh;display:grid;grid-template-columns:1.05fr 1fr;gap:3vw;align-items:center;padding:110px 4vw 4vw}
h1{margin:0;font:800 clamp(64px,9.5vw,170px)/.88 Geologica,sans-serif;letter-spacing:-.055em}
h1 em{font-style:normal;font-weight:300;letter-spacing:-.03em;display:block;font-size:.2em;line-height:1.35;letter-spacing:-.01em;max-width:22em;margin-top:.6em}
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:40px;padding:8px 8px 8px 24px;border-radius:99px;background:#16161a;color:#fff;font-weight:500;transition:transform .5s cubic-bezier(.32,.72,0,1)}
.cta i{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal;transition:transform .5s cubic-bezier(.32,.72,0,1)}
.cta:hover i{transform:translate(2px,-2px) scale(1.06)}.cta:active{transform:scale(.98)}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:9vw;gap:12px}
.bz{padding:6px;border-radius:28px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 20px 50px -24px rgba(30,30,60,.3);animation:fu 1s cubic-bezier(.32,.72,0,1) both;animation-delay:var(--d)}
.bz>*{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}
@keyframes fu{from{opacity:0;transform:translateY(40px);filter:blur(10px)}}
@media(max-width:860px){nav{top:10px}nav a{padding:7px 9px;font-size:11.5px}.s{grid-template-columns:1fr;padding:84px 16px 24px}.bento{grid-auto-rows:22vw}}
