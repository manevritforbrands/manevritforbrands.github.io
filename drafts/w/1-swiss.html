<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><title>1 Швейцарский плакат</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--paper:#EAE8E3;--ink:#0b0b0b;--red:#E61919}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 11px/1.35 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
a{color:inherit;text-decoration:none}
.g{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:44px 1fr auto 150px;height:100svh;border:2px solid var(--ink)}
.c{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);position:relative;overflow:hidden;padding:10px}
nav.c{grid-column:1/13;display:flex;gap:0;padding:0}nav a{flex:1;display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--ink)}nav a.on{background:var(--ink);color:var(--paper)}
.wm{grid-column:1/13;padding:0 8px;border-bottom:6px solid var(--red)}
.wm h1{margin:0;font:400 23.2vw/.8 Anton,sans-serif;letter-spacing:-.02em;transform:translateY(.04em);clip-path:inset(0 0 0 0);animation:up 1.1s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{clip-path:inset(100% 0 0 0);transform:translateY(.4em)}}
.ph{padding:0}.ph img,.ph video{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.35) brightness(1.05);display:block;animation:wipe 1.2s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
.ph:hover img,.ph:hover video{filter:none}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}}
.ph span{position:absolute;left:6px;bottom:6px;background:var(--paper);padding:2px 5px}
.meta b{display:block;font-weight:700;margin-bottom:6px}.red{color:var(--red)}
@media(max-width:760px){.g{grid-template-columns:repeat(4,1fr);grid-template-rows:44px auto 1fr 1fr;height:auto;min-height:100svh}nav.c{grid-column:1/5}nav a{padding:0 6px;font-size:9px}.wm{grid-column:1/5}.wm h1{font-size:30.5vw}.ph{grid-column:span 2!important;height:36vw}.meta{grid-column:span 2!important}.hide{display:none}}
</style></head><body><div class="g">
<nav class="c"><a class="on" href="#">Главная</a><a href="#">AI-видео</a><a href="#">AI-фото</a><a href="#">Стоимость</a><a href="#">Контакты</a></nav>
<div class="c meta" style="grid-column:1/4"><b>ManeVRit for Brands</b>Рекламные ролики и фото<br>на генеративных моделях.<br><br><span class="red">Без съёмочной смены.</span></div>
<div class="c ph" style="grid-column:4/7;--d:.2s"><img src="../../assets/garden-editorial.jpg" alt=""><span>01</span></div>
<div class="c ph" style="grid-column:7/9;--d:.35s"><video src="../../assets/videos/racing-case.mp4" poster="../../assets/videos/racing-case.jpg" autoplay muted loop playsinline></video><span>02</span></div>
<div class="c ph hide" style="grid-column:9/11;--d:.5s"><img src="../../assets/jewellery-detail.jpg" alt=""><span>03</span></div>
<div class="c meta hide" style="grid-column:11/13"><b>Ростов-на-Дону</b>47.2357° N<br>39.7015° E<br><br><b>Связь</b>t.me/manevritforbrands</div>
<div class="c wm"><h1>MANEVRIT</h1></div>
<div class="c ph" style="grid-column:1/4;--d:.6s"><img src="../../assets/teal-fashion.jpg" alt=""></div>
<div class="c ph" style="grid-column:4/6;--d:.7s"><img src="../../assets/lake-tailoring.jpg" alt=""></div>
<div class="c ph hide" style="grid-column:6/9;--d:.8s"><video src="../../assets/videos/mono-case.mp4" poster="../../assets/videos/mono-case.jpg" autoplay muted loop playsinline></video></div>
<div class="c ph hide" style="grid-column:9/11;--d:.9s"><img src="../../assets/tennis-lifestyle.jpg" alt=""></div>
<div class="c meta" style="grid-column:11/13;display:flex;align-items:flex-end"><a href="#" style="border-bottom:2px solid var(--red)">Смотреть все работы</a></div>
</div></body></html>
