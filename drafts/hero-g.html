<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>G — Стена работ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Cormorant+Garamond:ital,wght@1,400&family=Manrope:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0c0c0c;color:#fff}
body{font:500 11px/1.5 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase}
a{color:inherit;text-decoration:none}
nav{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:center;gap:40px;padding:24px 16px;z-index:10}
.stage{position:relative;height:100svh;min-height:620px;overflow:hidden}
/* Бесконечные колонки работ едут навстречу друг другу */
.wall{position:absolute;inset:-5% -2%;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;rotate:-6deg;scale:1.12}
.col{display:flex;flex-direction:column;gap:14px;animation:up var(--s) linear infinite}
.col.dn{animation-name:dn}
.col img,.col video{width:100%;display:block;object-fit:cover;border-radius:2px}
@keyframes up{to{transform:translateY(-50%)}}@keyframes dn{from{transform:translateY(-50%)}to{transform:translateY(0)}}
/* Название вычитает цвета из того, что проезжает под ним */
.veil{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse 60% 45% at center,rgba(8,8,8,.82),rgba(8,8,8,.35) 70%,rgba(8,8,8,.15)),linear-gradient(#0c0c0c 0,transparent 90px)}
.mark{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:5;color:#fff;pointer-events:none}
.mark h1{margin:0;font:800 clamp(52px,12.5vw,220px)/.85 Unbounded,sans-serif;letter-spacing:-.05em}
.mark i{display:block;font:italic 400 clamp(30px,3.6vw,60px)/1 'Cormorant Garamond',serif;letter-spacing:0;text-transform:none;margin-top:.15em}
@media(max-width:760px){nav{gap:18px;font-size:10px}.wall{grid-template-columns:repeat(3,1fr)}.col:nth-child(n+4){display:none}}
</style>
</head>
<body>
<nav><a href="#">Главная</a><a href="#">Портфолио</a><a href="#">Стоимость</a><a href="#">Контакты</a></nav>
<section class="stage">
  <div class="wall" id="wall"></div>
  <div class="veil"></div><div class="mark"><h1>MANEVRIT</h1><i>for Brands</i></div>
</section>
<script>
const A='../assets/',items=['garden-editorial.jpg','videos/racing-case','teal-fashion.jpg','jewellery-detail.jpg','lake-tailoring.jpg','videos/mono-case','tennis-lifestyle.jpg'];
const el=n=>n.startsWith('videos/')?`<video poster="${A+n}.jpg" src="${A+n}.mp4" autoplay muted loop playsinline style="aspect-ratio:${n.includes('mono')?'1/1':'3/4'}"></video>`:`<img src="${A+n}" style="aspect-ratio:4/5" alt="">`;
const wall=document.getElementById('wall');
for(let c=0;c<5;c++){const seq=[0,1,2,3].map(k=>items[(c*3+k)%items.length]);const html=seq.map(el).join('');
  wall.insertAdjacentHTML('beforeend',`<div class="col ${c%2?'dn':''}" style="--s:${60+c*9}s">${html+html}</div>`)}
</script>
</body></html>
